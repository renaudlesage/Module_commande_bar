<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Commande bar — Bucolique Blind Test</title>
    <meta name="description" content="Commande de boissons par QR code — Bucolique Ferrières Musique" />
    <meta name="theme-color" content="#3A2B66" />

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <!-- iOS ignore les icônes du manifeste pour l'écran d'accueil :
         c'est cette balise qui fournit l'icône installée. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bar Buco" />

    <!-- Safari transforme les suites de chiffres en liens d'appel,
         ce qui casse l'affichage des numéros de table. -->
    <meta name="format-detection" content="telephone=no" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
